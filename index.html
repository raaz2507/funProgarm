<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>fun programs</title>
	<style>
		*{
			padding:0;
			margin: 0;
			box-sizing: border-box;
			/* border: 1px solid red; */
		}
		html, body{
			width: 100%;
			height: 100%;
		}
		body{
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 15px;
background:
linear-gradient(
135deg,
#e9d5ff 0%,
#fdf2f8 50%,
#fff7ed 100%
);

			backdrop-filter: blur(5px);
		}
		header{
			width:95%;
	margin-top:15px;
	padding:18px 25px;

	display:flex;
	justify-content:space-between;
	align-items:center;
	flex-wrap:wrap;

	border-radius:18px;

	background:linear-gradient(
135deg,
#7c3aed77,
#ec489a58
);

	box-shadow:0 4px 15px rgba(0,0,0,.15);
		}
		header h1{
			font-size:2rem;
	font-weight:bold;
	letter-spacing:1px;
	border:none;
		}
		main.container{
			width:95%;
			padding: 10px;
			border-radius: 10px;
			background-color: rgba(245, 245, 245, 0.8);
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 10px;
			box-shadow: 5px 5px 13px -3px rgba(128, 128, 128, 0.663);
		}
		main.container .card{
			width: 15rem;
			border-radius: 5px;
			background-color: rgba(245, 222, 179, 0.512);
			box-shadow: 0 0  13px -3px rgba(137, 137, 137, 0.5);
		}
		main.container .card .iframeContainer{
			width: 100%;
			padding: 5px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card iframe{
			width:100%;
			height:130px;
			border:none;
			border-radius: 10px;
		}
		main.container .card .buttons{
			padding: 5px 10px;
		}
		.disciption{
			padding: 5px 10px;
		}
		.card a.btn{
			display:inline-block;
			padding: 5px;
			border-radius: 5px;
			text-decoration: none;
			margin: 5px 10px;
			border: 1px solid gray;
			background-color: rgba(128, 128, 128, 0.621);
			color: white;
			transition: color 300ms ease, background-color 300ms ease;
		}
		.card a.btn:hover{
			color: gray;
			background-color: white;
		}
	</style>
</head>
<body>
	<header>
		<h1>Fun Programs</h1>
	</header>
	<main class="container">
		<div class="card">
		<div class="iframeContainer">
			<iframe src="./doULoveMe/doULoveMe.html" frameborder="0"></iframe>
		</div>

		<p class="disciption">Funny "Do you love me?" Lovly-Tease program.</p>
	
		<div class="buttons">
			<a class="btn" href="./doULoveMe/doULoveMe.html">Open</a>
		</div>
	</div>
	</main>
</body>
</html>
